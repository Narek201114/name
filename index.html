<!DOCTYPE html>
<html lang="hy">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Անվան Իմաստը (Google AI Որոնում)</title>
    <style>
        :root {
            --primary: #4285f4;
            --primary-hover: #357ae8;
            --bg-gradient: linear-gradient(135deg, #f0f4f8 0%, #d7e3fc 100%);
            --card-bg: #ffffff;
            --text-main: #202124;
            --text-muted: #5f6368;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
            width: 100%;
            max-width: 600px;
            text-align: center;
        }

        h1 {
            color: var(--text-main);
            margin-bottom: 8px;
            font-size: 28px;
        }

        p.subtitle {
            color: var(--text-muted);
            margin-bottom: 24px;
            font-size: 15px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        input {
            flex: 1;
            padding: 14px 18px;
            border: 2px solid #dfe1e5;
            border-radius: 12px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(66, 133, 244, 0.15);
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 14px 24px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        .loader {
            display: none;
            margin: 20px auto;
            border: 4px solid #f3f3f3;
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            width: 36px;
            height: 36px;
            animation: spin 1s linear infinite;
        }

        .result-card {
            background: #f8f9fa;
            border: 1px solid #dadce0;
            border-radius: 16px;
            padding: 24px;
            text-align: left;
            margin-top: 20px;
            display: none;
            animation: fadeIn 0.4s ease-in-out;
            max-height: 350px;
            overflow-y: auto;
        }

        .result-card h2 {
            color: #1a73e8;
            font-size: 20px;
            margin-bottom: 12px;
        }

        .result-card p {
            color: var(--text-main);
            line-height: 1.7;
            font-size: 15px;
            white-space: pre-line;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Անվան Իմաստը</h1>
        <p class="subtitle">Գրեք անունը, և համացանցի տվյալներով ԱԲ-ն կգրի դրա նշանակությունն ու կարճ պատմությունը:</p>
        
        <div class="input-group">
            <input type="text" id="nameInput" placeholder="Օրինակ՝ Գարիկ, Վարդան..." onkeypress="checkEnter(event)">
            <button onclick="searchWithAI()">Որոնել</button>
        </div>

        <div id="loader" class="loader"></div>

        <div id="result" class="result-card">
            <h2 id="resTitle"></h2>
            <p id="resText"></p>
        </div>
    </div>

    <script>
        // Այստեղ չակերտների մեջ տեղադրեք ձեր Google AI Studio-ի API բանալին 👇
        const API_KEY = "AQ.Ab8RN6L5CYeZb9hCB9HOrkcHpKQdemC77HP_gpXw5BbDmSPOIg";

        function checkEnter(event) {
            if (event.key === "Enter") {
                searchWithAI();
            }
        }

        async function searchWithAI() {
            const name = document.getElementById("nameInput").value.trim();
            const resultCard = document.getElementById("result");
            const loader = document.getElementById("loader");
            const resTitle = document.getElementById("resTitle");
            const resText = document.getElementById("resText");

            if (!name) {
                alert("Խնդրում ենք մուտքագրել անուն:");
                return;
            }

            resultCard.style.display = "none";
            loader.style.display = "block";

           const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`;
            // Խիստ հրահանգ ենք տալիս ԱԲ-ին՝ սկսել ուղիղ նշանակությունից
            const promptText = `Որոնիր համացանցում "${name}" անվան մասին և պատասխանը շարադրիր հետևյալ կառուցվածքով և հայերեն լեզվով:
1. Առաջին նախադասությամբ հստակ գրիր՝ "${name}" անունը նշանակում է [նշանակությունը]:
2. Դրանից հետո տուր կարճ ու հետաքրքիր տեղեկություն անվան ծագման և նշանակության մասին (օգտագործելով Google-ի տեղեկատվական ակնարկների տվյալները):`;

            const requestBody = {
                contents: [{
                    parts: [{ text: promptText }]
                }],
                tools: [{ "googleSearch": {} }]
            };

            try {
                const response = await fetch(url, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(requestBody)
                });

                const data = await response.json();
                
                if (data.error) {
                    throw new Error(data.error.message);
                }

                const answer = data.candidates[0].content.parts[0].text;

                resTitle.innerText = name + " անվան նշանակությունը";
                resText.innerText = answer;

                loader.style.display = "none";
                resultCard.style.display = "block";

            } catch (error) {
                loader.style.display = "none";
                alert("Սխալ տեղի ունեցավ: Ստուգեք API բանալին չակերտների մեջ ճիշտ գրված լինելը:");
                console.error(error);
            }
        }
    </script>
</body>
</html>
