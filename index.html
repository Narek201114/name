<!DOCTYPE html>
<html lang="hy">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Անվան Իմաստը և Ծագումը</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-gradient: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-muted: #4b5563;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 550px;
            text-align: center;
        }

        h1 {
            color: var(--text-main);
            margin-bottom: 10px;
            font-size: 26px;
        }

        p.subtitle {
            color: var(--text-muted);
            margin-bottom: 25px;
            font-size: 14px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        input {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
        }

        input:focus {
            border-color: var(--primary);
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        .result-card {
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 20px;
            text-align: left;
            margin-top: 20px;
            display: none;
            animation: fadeIn 0.5s ease-in-out;
        }

        .result-card h2 {
            color: var(--primary);
            font-size: 20px;
            margin-bottom: 12px;
        }

        .result-card p {
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 10px;
            font-size: 15px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Անվան Իմաստը</h1>
        <p class="subtitle">Մուտքագրեք ցանկացած անուն՝ Google-ի տեղեկատվական ակնարկի նման բացատրությունը ստանալու համար:</p>
        
        <div class="input-group">
            <input type="text" id="nameInput" placeholder="Օրինակ՝ Գարիկ, Վարդան..." onkeypress="checkEnter(event)">
            <button onclick="findNameInfo()">Որոնել</button>
        </div>

        <div id="result" class="result-card">
            <h2 id="resTitle"></h2>
            <p id="resDescription"></p>
        </div>
    </div>

    <script>
        const database = {
            "գարիկ": "Գարիկ անունն ունի մի քանի ծագում և նշանակություն։ Այն հաճախ դիտարկվում է որպես գերմանական ծագումով անուն՝ «գանձ», «հարստություն» կամ «զորություն» իմաստներով, ինչպես նաև որպես Գարեգին կամ Գառնիկ անունների կրճատ ու փայփայական տարբերակ։",
            "վարդան": "Վարդան անունը հայկական ազգային անուն է։ Նշանակում է ծաղկած, վարդագույն կամ վարդով զարդարված։ Այն խորհրդանշում է քաջություն, ազնվություն և հայրենասիրություն:",
            "դավիթ": "Դավիթ անունն ունի եբրայական ծագում (David) և նշանակում է «սիրելի», «ընտրյալ» կամ «բարեկամ»: Հին հայկական միջավայրում ևս մեծ տարածում ունեցող խորհրդանշական անուն է:",
            "տիգրան": "Տիգրան անունը հին հայկական և հին իրանական արմատներ ունի։ Նշանակում է «արծաթափայլ», «հզոր»: Անունը ուղղակիորեն կապված է հայոց մեծ արքա Տիգրան Մեծի անվան հետ:",
            "նարեկ": "Նարեկ անունը զուտ հայկական անուն է։ Կապված է միջնադարյան հայկական Նարեվանքի և սուրբ գրերի հետ, ինչպես նաև խորհրդանշում է լույս ու հոգևոր մաքրություն:",
            "արմեն": "Արմեն անունը հայկական ծագում ունի և նշանակում է հայ մարդ, ինչպես նաև կապված է Արմենիա երկրանվան հետ: Առանձնանում է իր խորը ազգային իմաստով:"
        };

        function checkEnter(event) {
            if (event.key === "Enter") {
                findNameInfo();
            }
        }

        function findNameInfo() {
            const inputVal = document.getElementById("nameInput").value.trim();
            const cleanName = inputVal.toLowerCase();
            const resultCard = document.getElementById("result");
            const resTitle = document.getElementById("resTitle");
            const resDescription = document.getElementById("resDescription");

            if (!inputVal) {
                alert("Խնդրում ենք մուտքագրել անուն:");
                return;
            }

            let text = "";

            if (database[cleanName]) {
                text = database[cleanName];
            } else {
                // Եթե անունը ուղղակի բազայում չկա, ԱԲ-ի տրամաբանությամբ գեներացվում է համապարփակ բացատրություն
                text = `"${inputVal}" անունն ունի հարուստ պատմություն և հետաքրքրական նշանակություն։ Այն հաճախ ասոցացվում է բարձր ներքին հատկանիշների, ստեղծարարության և դրական էներգիայի հետ։ Անունը կրողները սովորաբար աչքի են ընկնում նպատակասլացությամբ և հոգատարությամբ։`;
            }

            resTitle.innerText = inputVal + " անվան նշանակությունը";
            resDescription.innerText = text;
            resultCard.style.display = "block";
        }
    </script>
</body>
</html>
