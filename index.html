<!DOCTYPE html>
<html lang="hy">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Անվան Իմաստը (Google Search)</title>
    <style>
        body { background: #f0f2f5; font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        input { width: 100%; padding: 12px; margin: 15px 0; border: 2px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        button { background: #4285f4; color: white; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; width: 100%; font-size: 16px; }
        button:hover { background: #357ae8; }
    </style>
</head>
<body>

<div class="container">
    <h2>Անվան բացատրություն</h2>
    <p>Գտեք անվան իմաստը Google-ում:</p>
    <input type="text" id="nameInput" placeholder="Օրինակ՝ Վարդան">
    <button onclick="searchName()">Որոնել Google-ում</button>
</div>

<script>
    function searchName() {
        const name = document.getElementById("nameInput").value.trim();
        if (name) {
            // Այստեղ կազմում ենք Google-ի որոնման հղումը
            const url = `https://www.google.com/search?q=անվան+իմաստը+${encodeURIComponent(name)}`;
            // Բացում ենք նոր պատուհանում
            window.open(url, '_blank');
        } else {
            alert("Խնդրում ենք գրել անուն:");
        }
    }
</script>

</body>
</html>
